<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Sciccors Game</title>
    <link rel="stylesheet" href="RPS.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices-row">
        <div class="choices" id="rock">
            <img src="./pictures/rock2.png" alt="">
        </div>
        <div class="choices" id="paper">
            <img src="./pictures/paper2.png" alt="">
        </div>
        <div class="choices" id="scissors">
            <img src="./pictures/67ebfd32e898b4ec3ae4e59ae33832c8.jpg" alt="">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>Your Score</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>Computer Score</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move!</p>
    </div>
    <script src="RPS.js"></script>
</body>
</html>
